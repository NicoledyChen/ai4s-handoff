<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Agent 框架：任务驱动协作，角色管理多级信息</title>
  <desc id="diagram-desc">概念框架。科学家通过 Grok 式角色入口和群聊表达意图与反馈。任务契约和任务图委派到分析、可视化、流程三个责任入口。角色共同产出和维护同一版本化对象与证据，提出分层信息，由 Lumen Projector 检查来源、状态与权限，再以 Signal、Summary、Workbench、Analysis、Source 五级返回科学家。展开信息的 PULL 与具体动作授权 APPROVE 分开。真实执行底座只作为拟接入接口。MaSIF 对应阶段四位点、八设计边界、十一母体、十二复核。角色不是模拟研究组，Grok 接入尚待验证。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2D5BFF"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#168A86"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7890A4"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F8FAFC"/>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#142B3F">
    <text x="64" y="78" font-size="46" font-weight="700">Agent 框架</text>
    <text x="66" y="123" font-size="28" fill="#50687B">任务驱动协作，角色管理多级信息</text>
    <rect x="1372" y="48" width="162" height="46" rx="23" fill="#E9EFFB"/>
    <text x="1453" y="79" text-anchor="middle" font-size="24" fill="#2D5BFF">产品框架</text>

    <!-- Primary loop: human → HCI → task contracts → roles → artifact → projection → human. -->
    <g fill="none" stroke="#2D5BFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 305 234 H 359" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
      <path d="M 765 234 H 819" marker-end="url(#arrow-blue)"/>
      <path d="M 1179 295 V 349" marker-end="url(#arrow-blue)"/>
      <path d="M 1179 537 V 579" marker-end="url(#arrow-blue)"/>
    </g>
    <g fill="none" stroke="#168A86" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 823 638 H 755" marker-end="url(#arrow-teal)"/>
      <path d="M 389 638 H 339" marker-end="url(#arrow-teal)"/>
      <path d="M 184 383 V 299" marker-end="url(#arrow-teal)"/>
    </g>
    <path d="M 1535 450 H 1562 V 783 H 1539" fill="none" stroke="#7890A4" stroke-width="2.5" stroke-dasharray="7 7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>

    <!-- Human and upper HCI. -->
    <rect x="64" y="172" width="240" height="122" rx="20" fill="#142B3F"/>
    <text x="184" y="220" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">科学家</text>
    <text x="184" y="261" text-anchor="middle" font-size="24" fill="#E8F0F7">意图／判断／反馈</text>

    <rect x="364" y="172" width="400" height="122" rx="20" fill="#FFFFFF" stroke="#2D5BFF" stroke-width="2.5"/>
    <text x="564" y="219" text-anchor="middle" font-size="28" font-weight="700">Grok Bot Chat</text>
    <text x="564" y="260" text-anchor="middle" font-size="24" fill="#50687B">角色单聊 · 群聊 · 结果卡</text>

    <rect x="824" y="172" width="710" height="122" rx="20" fill="#EAF0FF" stroke="#D7E2EB" stroke-width="2"/>
    <text x="1179" y="220" text-anchor="middle" font-size="28" font-weight="700" fill="#2D5BFF">Harness + Skill 任务图</text>
    <text x="1179" y="261" text-anchor="middle" font-size="24">输入 · 产物 · 验证 · 交接</text>

    <!-- Read and authorize are separate interaction contracts. -->
    <rect x="364" y="337" width="190" height="96" rx="16" fill="#E7F3F1" stroke="#D7E2EB" stroke-width="1.5"/>
    <text x="459" y="374" text-anchor="middle" font-size="24" font-weight="700" fill="#168A86">PULL · 展开</text>
    <text x="459" y="409" text-anchor="middle" font-size="22">只改变信息深度</text>
    <rect x="570" y="337" width="194" height="96" rx="16" fill="#FBF1E2" stroke="#D7E2EB" stroke-width="1.5"/>
    <text x="667" y="374" text-anchor="middle" font-size="22" font-weight="700" fill="#C88724">APPROVE · 授权</text>
    <text x="667" y="409" text-anchor="middle" font-size="22">指向具体动作</text>
    <text x="213" y="347" font-size="22" fill="#168A86">理解／反馈</text>

    <!-- Role names are addressable responsibilities, not simulated people. -->
    <rect x="824" y="354" width="710" height="182" rx="20" fill="#FFFFFF" stroke="#D7E2EB" stroke-width="2"/>
    <text x="850" y="391" font-size="24" fill="#50687B">按任务委派 · 同时管理工作与信息</text>
    <rect x="844" y="411" width="208" height="104" rx="14" fill="#EAF0FF"/>
    <text x="948" y="452" text-anchor="middle" font-size="28" font-weight="700" fill="#2D5BFF">分析</text>
    <text x="948" y="490" text-anchor="middle" font-size="24">比较／解释</text>
    <rect x="1074" y="411" width="208" height="104" rx="14" fill="#E7F3F1"/>
    <text x="1178" y="452" text-anchor="middle" font-size="28" font-weight="700" fill="#168A86">可视化</text>
    <text x="1178" y="490" text-anchor="middle" font-size="24">图形／变换</text>
    <rect x="1304" y="411" width="208" height="104" rx="14" fill="#FBF1E2"/>
    <text x="1408" y="452" text-anchor="middle" font-size="28" font-weight="700" fill="#C88724">流程</text>
    <text x="1408" y="490" text-anchor="middle" font-size="24">依赖／决策</text>

    <!-- A single object is projected; views do not become new sources of truth. -->
    <rect x="824" y="584" width="710" height="108" rx="20" fill="#FFFFFF" stroke="#168A86" stroke-width="2.5"/>
    <text x="1179" y="628" text-anchor="middle" font-size="28" font-weight="700">同一版本化对象 + 证据</text>
    <text x="1179" y="667" text-anchor="middle" font-size="24" fill="#50687B">角色共同产出与维护 · 可回到原生结果</text>

    <text x="570" y="553" text-anchor="middle" font-size="24" fill="#168A86">各角色提出分层信息</text>
    <rect x="390" y="578" width="360" height="114" rx="20" fill="#E7F3F1" stroke="#168A86" stroke-width="2.5"/>
    <text x="570" y="623" text-anchor="middle" font-size="28" font-weight="700" fill="#168A86">Lumen Projector</text>
    <text x="570" y="663" text-anchor="middle" font-size="24">守住来源 · 状态 · 权限</text>

    <rect x="64" y="384" width="270" height="308" rx="20" fill="#FFFFFF" stroke="#D7E2EB" stroke-width="2"/>
    <text x="199" y="423" text-anchor="middle" font-size="26" font-weight="700">五级信息</text>
    <rect x="80" y="442" width="238" height="42" rx="10" fill="#E7F3F1"/>
    <text x="199" y="471" text-anchor="middle" font-size="24">Signal · 信号</text>
    <rect x="80" y="490" width="238" height="42" rx="10" fill="#EEF6F5"/>
    <text x="199" y="519" text-anchor="middle" font-size="24">Summary · 摘要</text>
    <rect x="80" y="538" width="238" height="42" rx="10" fill="#F1F5FA"/>
    <text x="199" y="567" text-anchor="middle" font-size="24">Workbench · 操作</text>
    <rect x="80" y="586" width="238" height="42" rx="10" fill="#F1F5FA"/>
    <text x="199" y="615" text-anchor="middle" font-size="24">Analysis · 分析</text>
    <rect x="80" y="634" width="238" height="42" rx="10" fill="#F1F5FA"/>
    <text x="199" y="663" text-anchor="middle" font-size="24">Source · 来源</text>

    <!-- One boundary for the existing execution infrastructure, not a second infrastructure diagram. -->
    <rect x="924" y="746" width="610" height="74" rx="16" fill="#F1F5FA" stroke="#AEBFCD" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="1229" y="792" text-anchor="middle" font-size="26" fill="#50687B">既有工具与计算基础设施</text>

    <text x="64" y="765" font-size="22" fill="#50687B">MaSIF 四个决策关口</text>
    <text x="64" y="809" font-size="26"><tspan fill="#2D5BFF" font-weight="700">4</tspan> 位点　·　<tspan fill="#2D5BFF" font-weight="700">8</tspan> 设计边界　·　<tspan fill="#2D5BFF" font-weight="700">11</tspan> 母体　·　<tspan fill="#2D5BFF" font-weight="700">12</tspan> 复核</text>

    <path d="M 64 845 H 1534" fill="none" stroke="#D7E2EB" stroke-width="1.5"/>
    <text x="64" y="878" font-size="22" fill="#50687B">角色承载工作与信息责任｜工作可继承，智能可替换</text>
  </g>
</svg>
