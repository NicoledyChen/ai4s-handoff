te-id">${label(c.id)}</span></td><td>${CANDIDATE_TEXT[c.id].source}<br><span class="meta">${CANDIDATE_TEXT[c.id].family}</span></td><td>${CANDIDATE_TEXT[c.id].note}</td><td><button class="link" data-action="candidate-evidence" data-id="${c.id}">依据</button></td></tr>`).join(''):'<tr><td colspan="5" class="muted">当前没有未选项。所有候选仍可从“全部候选”回查。</td></tr>'}</tbody></table></div><div class="card"><label class="label" for="selection-reason">选择与未选理由</label><textarea id="selection-reason">${esc(state.selectionReason)}</textarea><div class="between wrap" style="margin-top:16px"><span class="meta">未选项保留，不从工作记录中删除。</span><button class="primary" data-action="save-selection">保存选择与理由</button></div></div>`}
function renderN4(){const id=state.focusCandidate;const isM1=id==='DEMO-M01',isM3=id==='DEMO-M03';const disposition=state.n4Dispositions[id];return `<div class="between wrap"><div class="sites">${['DEMO-M01','DEMO-M03'].map(x=>`<button class="${id===x?'active':''}" data-action="focus-candidate" data-id="${x}">${label(x)}</button>`).join('')}</div><button class="link" data-action="proposal">查看补充检查提案</button></div>${hero('对照设计意图，再判断下一步')}<div class="validation-grid"><div class="card ${isM1?'amber':''}"><div class="between"><span class="pill ${isM1?'amber':'blue'}">${isM1?'需要处理冲突':'一致性待复核'}</span><button class="link" data-action="candidate-evidence" data-id="${id}">展开依据</button></div><div class="conflict-text">${isM1?'置信度不能消除<br>设计位点的冲突。':'保留不同结构假设，<br>继续检查一致性。'}</div><p class="muted">${isM1?'候选 01 的预置案例：预测置信度较高，但偏离原设计位点。不能直接入选。':'候选 03 未出现同一项预置位点冲突，但尚无多次预测的一致性证据。'}</p><div class="compare-strip" style="margin-top:20px"><div class="comparison"><div class="heading">设计意图</div><strong>保持目标位点</strong><p>回到原始选择与限制</p></div><div class="comparison"><div class="heading">当前复核</div><strong>${isM1?'位点存在冲突':'仍需进一步检查'}</strong><p>${isM1?'先查冲突，不用单一分数代替判断':'没有重复证据，不能推断稳定'}</p></div></div></div><div class="stack"><div class="card"><h2>记录处置</h2><p class="muted" style="margin-top:10px">${isM1?'保留冲突和退回理由，不把它从结果中抹掉。':'保留候选，并把未完成的检查带到下一步。'}</p><div class="actions"><button class="primary" data-action="disposition" data-id="${id}" data-disposition="${isM1?'return-for-review':'retain-pending-further-review'}">${isM1?'候选 01 退回复核':'候选 03 保留待复核'}</button></div><div class="statusline" style="margin-top:15px">${disposition?'已记录：'+esc(disposition.label):'等待处置'}</div></div><div class="card soft"><h3>把复核决定接到下一步</h3><dl class="keyvalue" style="margin:15px 0 0"><dt>复核维度</dt><dd>位点 / 界面 / 一致性</dd><dt>一致性检查</dt><dd>尚待复核</dd><dt>新增计算</dt><dd>未提交提案</dd></dl><div class="actions"><button class="link" data-action="proposal">查看下一步</button></div></div></div></div><div class="notice">复核结果不等于实验成功。${state.selection.includes(id)?'该候选在当前选择中。':'该候选是预置复核情节，未在当前母体选择中。'}</div>`}
function analysisContent(){const paragraphs={N1:['site 编号仅用于区分记录，不代表可比较的质量等级。功能残基限制表达的是生物学意图，不应与保留位点数量混为一谈。','本页只保存选择草案。真实结构、链、残基映射与允许偏移尚不完整，不能自动进入搜索。'],N2:['Target 序列不变与骨架可动是两个不同维度。界面将序列、骨架和保护 motif 分开，避免“固定 target”产生歧义。','任何规则变化都会新增 DesignPolicy 修订，旧确认失效。重新确认仅保存本地演示中的当前范围，不提交 Rosetta 作业。'],N3:['候选总数、独立 seed 来源和结构家族描述不同信息。当前资料只给出 633 个结果与 3 个来源，来源占比未知，不能绘制真实分布或 Pareto 散点。','四条独立示例用来说明选择逻辑：01 与 02 同来源同家族；03 代表不同假设；04 证据未齐。这里的多样性计数只对这四条示例成立。'],N4:['候选 01 的置信度与位点冲突是预置情节，不是真实 AF3 结果。不能因为“高置信度”忽略设计意图；也不能因候选 03 未出现同一冲突就宣布成功。','seed 来源回答“候选从哪里来”；model seed 是预测随机种子。资料实例每个 AF3 输入只有一个 model seed，无法据此检验重复一致性。']};return `<div class="card"><div class="between"><h2>判断依据与限制</h2><span class="pill">${state.node}</span></div>${paragraphs[state.node].map(t=>`<p class="muted" style="margin-top:17px">${t}</p>`).join('')}<div class="actions"><button class="primary" data-action="level" data-level="Workbench">回到工作面</button><button data-action="evidence">原始依据</button></div></div><div class="card"><h3>当前选择与接续</h3><p class="muted" style="margin-top:11px">${currentSelectionText()}</p><div class="timeline"><span>输入 / 位点</span><i>→</i><span>设计范围</span><i>→</i><span>母体选择</span><i>→</i><span>复核 / 未决事项</span></div><button class="link" data-action="decisions">查看本地决定与版本</button></div>`}
function sourceLinks(){return `<div class="source-list"><a class="source-link" href="../00_DEMO_INTRO.md" target="_blank" rel="noopener">三分钟演示说明<span>打开</span></a><a class="source-link" href="../03_MASIF_DEMO_CASE.md" target="_blank" rel="noopener">四节点案例与证据边界<span>打开</span></a><a class="source-link" href="../demo-fixtures.json" target="_blank" rel="noopener">候选与聚合数据骨架<span>打开</span></a><a class="source-link" href="../sources/guide-extracted.txt" target="_blank" rel="noopener">用户流程指南摘录<span>打开</span></a></div>`}
function sourceContent(){return `<div class="card"><h2>来源、版本与真实边界</h2><p class="muted" style="margin:12px 0 17px">团队已经通过 AI 完成实际科研探索，聚合数字来自团队研究记录。本界面把已有轨迹演绎为可操作的产品体验；对话与四个候选是独立交互样例，等待对应原始记录替换。当前 HTML 尚未连接真实计算集群或模型服务。</p><div class="row wrap"><span class="pill">sourceKind: document-example / synthetic</span><span class="pill">executionMode: replay / local-interaction</span></div><div class="divider"></div>${sourceLinks()}</div><div class="card"><h2>尚未导入本界面的科学原件</h2><div class="tablewrap" style="margin-top:15px"><table aria-label="缺失科学原件"><thead><tr><th>材料</th><th>当前状态</th></tr></thead><tbody><tr><td>Target / mesh / 真实残基映射</td><td>未提供</td></tr><tr><td>Rosetta 配置、结构与运行日志</td><td>未提供</td></tr><tr><td>633 条完整候选与来源占比</td><td>未提供</td></tr><tr><td>633 → 150 的候选名单映射</td><td>未提供</td></tr><tr><td>AF3 结构、分数、PAE 与重复运行</td><td>未提供</td></tr></tbody></table></div><p class="meta" style="margin-top:13px">因此不绘制真实结构、评分分布、来源占比或 PAE 热图。概念插图不提供任何科学证据。</p></div><div class="actions"><button data-action="decisions">查看决定</button><button class="primary" data-action="export">导出本地记录 JSON</button></div>`}
function openDrawer(mode){drawerReturnFocus=document.activeElement;drawerMode=mode;renderDrawer();document.getElementById('inspector').hidden=false;document.getElementById('drawer-backdrop').hidden=false;document.getElementById('close-drawer').focus()}
function closeDrawer(){drawerMode=null;document.getElementById('inspector').hidden=true;document.getElementById('drawer-backdrop').hidden=true;if(drawerReturnFocus?.isConnected)drawerReturnFocus.focus()}
const SKILL_CONTRACTS={N1:{name:'SiteSelection',input:'Target、链、表面与位点候选',decision:'site、功能残基限制与位点偏移',artifact:'SiteDecision · 选择与版本',continue:'输入明确、选择确认后接续搜索'},N2:{name:'RosettaDesign',input:'复合物、motif 与原生配置',decision:'序列、骨架、保护范围与预算',artifact:'DesignPolicy / RunBundle',continue:'当前版本确认，输入与权限齐备'},N3:{name:'GraftSelection',input:'嫁接候选、来源映射与指标',decision:'母体组合、配额与未选理由',artifact:'CandidateSet · 候选与谱系',continue:'硬约束、来源和选择可核对'},N4:{name:'AF3Review',input:'预测结构、位点与置信度证据',decision:'冲突处置、深筛范围与预算',artifact:'ValidationBundle · 复核记录',continue:'关键冲突已处理；缺项保持未决'}};
function skillContent(){return `<div class="kicker">探索 → 固化 → 接续</div><h3>把已跑出的轨迹，变成可复用的工作合同。</h3><p>团队已有真实探索与成果。Skill 把每一处输入、人的判断、产物和接续条件固定下来，作为稳定复跑与替换执行实例的边界。</p><div class="divider"></div>${FIXTURES.nodes.map(n=>{const k=SKILL_CONTRACTS[n.id];return `<div class="card ${n.id===state.node?'blue':''}" style="margin-bottom:14px"><div class="between"><strong>${n.id} · ${n.label}</strong><button class="link" data-action="node" data-node="${n.id}">查看</button></div><div class="mono" style="color:var(--accent);margin:7px 0 14px">${k.name}</div><dl class="keyvalue" style="margin:0"><dt>Input</dt><dd>${k.input}</dd><dt>Decision</dt><dd>${k.decision}</dd><dt>Artifact</dt><dd>${k.artifact}</dd><dt>Continue</dt><dd>${k.continue}</dd></dl></div>`}).join('')}<h3>保留真实工作的落点</h3><p>Notebook、Git、结构与结果文件、原生计算环境继续拥有产物；角色管理信息层级，工作记录保存版本、决定与未决状态。</p><h3>当前接入边界</h3><p>这里展示拟固化的 Skill 合同，不表示当前 HTML 已安装或执行这些 Skill。稳定复跑需用原始输入、固定版本和真实执行环境验证；此页面尚未连接真实集群。</p>`}
function renderDrawer(){const title=document.getElementById('drawer-title'),body=document.getElementById('drawer-body');if(drawerMode==='skills'){title.textContent='Skill 流程';body.innerHTML=skillContent();return}if(drawerMode==='about'){title.textContent='关于这段概念演示';body.innerHTML=`<div class="kicker">Lumen / AI4S</div><h3>智能可以替换，工作与判断不丢。</h3><p>团队已用 AI 完成实际科研探索。这里将已有轨迹产品化：把输入、判断、产物和接续条件固化为 Skill，让工作能够被稳定复跑、检查与接管。</p><h3>哪些来自哪里</h3><p>208、60、13、1864、633、3、150 是团队报告的实际探索记录，并非虚构研究。候选 01–04、对话与复核冲突则是候选视图交互样例，待以对应原始记录替换，不是从 633 条记录抽样。</p><p style="margin-top:12px">当前浏览器演绎既有轨迹，没有向真实集群提交作业。Skill 合同在本界面展示，实际稳定复跑仍需接入真实原件、执行环境并验证。页面插图是概念视觉，不是真实坐标；不承诺效率提升或实验成功。</p><h3>可用的本地操作</h3><p>切换节点与信息层级、选择位点、修改规则、比较候选、保存决定、回查未选项、导出与重置。</p><div class="actions"><button data-action="export">导出本地记录 JSON</button><button data-action="reset">重置演示</button></div><div class="divider"></div>${sourceLinks()}`;return}if(drawerMode==='decisions'){title.textContent='决定与接续记录';body.innerHTML=`<p class="muted">${state.decisions.length} 条本地记录。选择与撤销都保留；这些页面记录不构成真实集群的作业授权。</p><div class="actions"><button class="primary" data-action="export">导出本地记录 JSON</button><button data-action="reset">重置演示</button></div><div class="divider"></div>${state.decisions.length?state.decisions.slice().reverse().map(d=>`<div class="decision-item"><div class="between"><strong>${esc(decisionTitle(d.type))}</strong><span class="pill">${esc(d.node)}</span></div><div class="meta">${esc(dateText(d.createdAt))} · ${esc(d.objectRef)} v${d.objectVersion}</div><pre>${esc(JSON.stringify(d.payload,null,2))}</pre></div>`).join(''):'<div class="empty">还没有决定。先在工作面保存一次选择。</div>'}`;return}if(drawerMode==='proposal'){title.textContent='下一步提案';body.innerHTML=`<span class="pill amber">未提交 · 待材料与预算</span><h3>补充复核，不跳过冲突</h3><ul><li>候选 01：核对设计位点与预测位点差异。</li><li>候选 03：补充重复预测的一致性证据。</li><li>提供真实结构、完整 PAE 和必要原始记录。</li></ul><h3>当前范围</h3><dl class="keyvalue"><dt>提案状态</dt><dd>proposed</dd><dt>已批准</dt><dd>否</dd><dt>已提交</dt><dd>否</dd><dt>计算量 / 费用</dt><dd>未测算</dd></dl><p>本页面不提交科学任务。保存提案只把待办事项加入本地工作记录。</p><div class="actions"><button class="primary" data-action="save-proposal">保存未提交提案</button><button data-action="decisions">查看检查点</button></div>`;return}title.textContent=drawerMode==='aggregate'?'资料概览的来源':'证据与来源';let candidate='';if(drawerMode.startsWith('candidate:')){const id=drawerMode.split(':')[1],c=FIXTURES.syntheticCandidates.find(x=>x.id===id);candidate=`<h3>${label(id)}</h3><dl class="keyvalue"><dt>内部 ID</dt><dd class="mono">${c.id}</dd><dt>数据类别</dt><dd>synthetic / 候选视图交互样例</dd><dt>来源</dt><dd class="mono">${c.seedSource}</dd><dt>结构家族</dt><dd class="mono">${c.scaffoldFamily}</dd><dt>真实结构</dt><dd>未提供</dd><dt>实测分数</dt><dd>未提供</dd><dt>当前选择</dt><dd>${state.selection.includes(id)?'已选择':'未选择，记录保留'}</dd></dl><p>${CANDIDATE_TEXT[id].note}。待以对应原始记录替换，目前不对应 633 条真实结果中的具体候选。</p><div class="divider"></div>`}body.innerHTML=`${candidate}<h3>来源与执行模式</h3><dl class="keyvalue"><dt>当前节点</dt><dd>${state.node} / 阶段 ${FIXTURES.nodes.find(x=>x.id===state.node).sourceSection}</dd><dt>对象版本</dt><dd>${NODES[state.node].object} v${currentVersion()}</dd><dt>数据来源</dt><dd>团队研究记录 + 独立交互样例</dd><dt>节点推进</dt><dd>replay / 预置检查点</dd><dt>当前操作</dt><dd>local-interaction / 本地交互</dd><dt>科学计算</dt><dd>未接入、未提交</dd></dl><h3>团队研究记录</h3><p>208 个匹配 → 60 个聚类代表 → 13 个筛选后 seed/motif → 1864 个嫁接构象 → 633 个筛选结果 → 150 个 AF3 输入。</p><p style="margin-top:10px">13 → 1864 是嫁接扩增，不是单调漏斗。633 个结果来自 3 个 seed ID，来源占比和到 150 的名单映射均未提供。150 是 AF3 输入数量，不是验证成功数。</p><p style="margin-top:10px">每个 AF3 输入只使用一个 model seed，不能据此说明多次预测一致。seed 来源与 model seed 不同。</p><h3>缺失材料</h3><p>真实结构/mesh、残基映射、原生配置与日志、候选全表、实测评分、PAE 和重复运行结果：尚未导入本界面。这不表示团队没有完成探索或没有这些产物。</p><h3>可打开的资料</h3>${sourceLinks()}<div class="actions"><button data-action="decisions">回查人的决定</button><button data-action="about">展示说明</button></div>`}
function decisionTitle(type){return ({'site-draft':'保存位点草案','design-confirmation':'确认设计范围','design-change':'设计范围变更 / 旧确认失效','candidate-selection':'保存母体选择','selection-undo':'撤销上次选择','candidate-disposition':'记录复核处置','review-proposal':'保存未提交提案'})[type]||type}
function goNode(node,fromNext=false){if(!NODES[node])return;const previous=state.node;state.node=node;state.level='Workbench';if(fromNext){const bridge=FIXTURES.bridgeNotices.find(x=>x.from===previous&&x.to===node);if(bridge)addMessage('流程',`现在跳到下一预置检查点。中间阶段 ${bridge.sourceStages.join('、')} 由案例桥接，没有运行新计算。`,node);sceneMessages(node)}else if(!state.visited.includes(node))sceneMessages(node);persist();render();document.getElementById('workscroll').scrollTop=0;document.getElementById('messages').scrollTop=document.getElementById('messages').scrollHeight}
function nextScene(){const i=FIXTURES.nodes.findIndex(x=>x.id===state.node);if(i<3)goNode(FIXTURES.nodes[i+1].id,true);else{addMessage('流程','这一轮停在可继续的检查点：保留选择、冲突和未决事项；补充计算仍是未提交的提案。');persist();render();openDrawer('proposal')}}
function answerQuestion(text){const input=text.trim();if(!input)return;addMessage('用户',input);let role=input.includes('@可视化')?'可视化':input.includes('@流程')?'流程':'分析',reply='',action=null;const t=input.replace(/\s/g,'');const roleOnly=/^@(分析|可视化|流程)[，,。!！?？]*$/.test(t);if(/来源|原始|材料|证据|依据|输入/.test(t)){reply='我打开团队研究记录，查看本轮输入与判断依据。对应原始引用和当前演示包范围，在来源面板说明。';action='evidence'}else if(/下一步|预算|补算|提交|计算/.test(t)){role='流程';reply='先保留复核提案，确认本轮范围与预算后，再按记录接续。当前页面不会提交真实计算。';action='proposal'}else if(state.node==='N1'&&(/位点|两个|site|为什么/.test(t)||roleOnly)){reply=role==='可视化'?'当前可以切换 site 0、site 1 或并排比较选择。把两处选择与约束一起看，再保存本轮设计意图。':'两个位点分别记录，编号不代表质量等级。没有指定功能残基时，先保存意图和未确定的限制。'}else if(state.node==='N2'&&(/固定|骨架|序列|范围|确认|修改/.test(t)||roleOnly)){reply=role==='流程'?'确认绑定当前版本。修改任何设计规则后，旧确认会失效；新范围需要重新确认。':'固定 target 序列，不等于冻结其骨架。资料把 target 骨架可动、binder 骨架固定分开设置。请分别确认序列、骨架与 motif 规则。'}else if(state.node==='N3'&&(/633|多|来源|家族|一起|01|02|选择|为什么/.test(t)||roleOnly)){reply='团队研究记录中，633 个结果只有 3 个 seed 来源。先看来源和结构家族，不能把总数当作独立方案数。在当前四条交互样例中，候选 01 与 02 同来源同家族；选 01 与 03 可保留不同结构假设，04 则还缺证据。'}else if(state.node==='N4'&&(/置信|位点|冲突|复核|01|03|为什么/.test(t)||roleOnly)){reply='候选 01 的预置情节是“置信度较高但偏离设计位点”，应先退回复核。候选 03 仍缺重复一致性证据，两者都不能直接标为实验成功。'}else{role='流程';reply='我能演示四个节点中的预置问答、选择与记录，尚不能回答任意科学问题。可以试试下方的快捷问题，或打开“证据与来源”。'}addMessage(role,reply);persist();render();document.getElementById('messages').scrollTop=document.getElementById('messages').scrollHeight;if(action)openDrawer(action)}
function exportRecords(){const payload={exportVersion:'1.0',exportedAt:new Date().toISOString(),caseId:FIXTURES.caseId,isScientificResult:false,notice:'Local productization of team-reported real AI scientific exploration. Document aggregates are team research records; candidate UI fixtures are separate and synthetic. This browser session submits no live scientific jobs.',sourceReferences:['00_DEMO_INTRO.md','03_MASIF_DEMO_CASE.md','demo-fixtures.json'],documentAggregates:FIXTURES.documentAggregates,syntheticCandidates:FIXTURES.syntheticCandidates,checkpoint:{node:state.node,level:state.level,sites:state.sites,siteDraft:state.siteDraft,policy:state.policy,policyRevision:state.policyRevision,confirmedPolicy:state.confirmedPolicy,selection:state.selection,selectionReason:state.selectionReason,n3Saved:state.n3Saved,n4Dispositions:state.n4Dispositions,pendingProposal:state.pendingProposal},decisions:state.decisions,messages:state.chat,storageKey:STORAGE_KEY};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='lumen-masif-decisions-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('记录已生成 JSON，已请求浏览器下载。')}
function handleAction(button){const a=button.dataset.action;if(a==='skills'){openDrawer('skills');return}if(a==='node'){goNode(button.dataset.node);return}if(a==='next'){nextScene();return}if(a==='level'){state.level=button.dataset.level;persist();render();return}if(a==='mention'){const input=document.getElementById('chat-input');input.value='@'+button.dataset.role+' ';input.focus();return}if(a==='question'){answerQuestion(button.dataset.question);return}if(a==='message-object'){goNode(button.dataset.node);return}if(a==='evidence'){openDrawer('evidence');return}if(a==='aggregate-evidence'){openDrawer('aggregate');return}if(a==='candidate-evidence'){openDrawer('candidate:'+button.dataset.id);return}if(a==='about'||a==='decisions'||a==='proposal'){openDrawer(a);return}if(a==='close-drawer'){closeDrawer();return}if(a==='focus-site'){state.focusSite=button.dataset.site;persist();render();return}if(a==='save-sites'){if(!state.sites.length){toast('请至少保留一个位点。');return}state.siteDraft={sites:[...state.sites],targetResidue:null,allowedDeviation:null,structureRef:null,chainRef:null,status:'draft',savedAt:new Date().toISOString()};record('site-draft',state.siteDraft);addMessage('用户','这一轮保留 '+state.sites.map(x=>'site '+x).join(' 和 ')+'，不增加残基限制。');addMessage('流程','位点选择已记录，并与本轮版本绑定。后续输入与判断将沿这条记录接续。');persist();render();savedToast('位点草案已保存');return}if(a==='confirm-policy'){state.confirmedPolicy=state.policyRevision;record('design-confirmation',{confirmedRevision:state.policyRevision,rules:{...state.policy},approvalScope:'local-demo-only',scientificExecutionAuthorized:false,requiredInputs:['chain-residue mapping','native configuration','budget']});addMessage('用户','按 v'+state.policyRevision+' 确认设计范围；扩大范围或预算时再问我。');addMessage('流程','已记录当前版本的范围。任何规则修改都会使这次确认失效。');persist();render();savedToast('本轮范围已确认');return}if(a==='candidate-filter'){state.candidateFilter=button.dataset.filter;persist();render();return}if(a==='recommend-selection'){state.n3Undo=[...state.selection];state.selection=['DEMO-M01','DEMO-M03'];state.n3Saved=null;persist();render();toast('已选择候选 01 与 03，等待保存理由。');return}if(a==='undo-selection'){if(!state.n3Undo)return;const restore=[...state.n3Undo];state.n3Undo=[...state.selection];state.selection=restore;state.n3Saved=null;record('selection-undo',{restoredSelection:[...state.selection],effect:'local selection only'});render();savedToast('已恢复上一次候选选择');return}if(a==='save-selection'){state.selectionReason=document.getElementById('selection-reason')?.value.trim()||state.selectionReason;state.n3Saved={selected:[...state.selection],unselected:FIXTURES.syntheticCandidates.filter(c=>!state.selection.includes(c.id)).map(c=>({id:c.id,reason:c.id==='DEMO-M02'?'同来源同家族，保留备选':c.id==='DEMO-M04'?'待补材料':'本轮未选，记录保留'})),reason:state.selectionReason,savedAt:new Date().toISOString()};record('candidate-selection',state.n3Saved);addMessage('用户','保留 '+(state.selection.length?state.selection.map(label).join('、'):'当前空选择')+'。'+state.selectionReason);addMessage('流程','选择与未选理由已记录。未选候选仍可回查；尚未提交复核计算。');persist();render();savedToast('选择与理由已保存');return}if(a==='focus-candidate'){state.focusCandidate=button.dataset.id;persist();render();return}if(a==='disposition'){const id=button.dataset.id;const description=button.dataset.disposition==='return-for-review'?'退回复核':'保留待进一步复核';state.n4Dispositions[id]={state:button.dataset.disposition,label:description,reason:id==='DEMO-M01'?'预置置信度与位点冲突':'重复一致性证据未提供',savedAt:new Date().toISOString()};record('candidate-disposition',{candidateId:id,...state.n4Dispositions[id],isScientificConclusion:false});addMessage('用户',label(id)+' '+description+'；新增计算先提供方案。');addMessage('流程','已记录 '+label(id)+' 的处置。补充计算仍是未提交提案。');persist();render();savedToast('处置已记录');return}if(a==='save-proposal'){state.pendingProposal={...state.pendingProposal,savedAt:new Date().toISOString(),approved:false,submitted:false};record('review-proposal',{...state.pendingProposal,scope:['核对候选 01 位点冲突','补充候选 03 重复一致性证据']});render();savedToast('未提交提案已保存');return}if(a==='export'){exportRecords();return}if(a==='reset'){document.getElementById('reset-dialog').showModal();return}if(a==='cancel-reset'){document.getElementById('reset-dialog').close();return}if(a==='confirm-reset'){try{localStorage.removeItem(STORAGE_KEY)}catch(e){storageAvailable=false}state=INITIAL();sceneMessages('N1');document.getElementById('reset-dialog').close();closeDrawer();persist();render();toast('已重置本演示；其他项目与数据未受影响。');return}if(a==='toggle-chat')document.getElementById('rail').classList.toggle('mobile-open')}
document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(button&&!button.disabled)handleAction(button)});
document.addEventListener('change',event=>{const el=event.target;if(el.dataset.change==='site'){state.sites=el.checked?[...new Set([...state.sites,el.dataset.site])]:state.sites.filter(x=>x!==el.dataset.site);state.siteDraft=null;persist();render()}if(el.dataset.change==='policy'){const key=el.dataset.key,old=state.policyRevision,oldApproval=state.confirmedPolicy;state.policy[key]=el.checked;state.policyRevision++;state.confirmedPolicy=null;state.lastPolicyChange={from:old,to:state.policyRevision,key,label:POLICY_RULES.find(x=>x[0]===key)[1],value:el.checked,invalidatedConfirmationRevision:oldApproval};record('design-change',{...state.lastPolicyChange,invalidatedConfirmationRevision:oldApproval});addMessage('流程','设计范围已更新至 v'+state.policyRevision+'。'+(oldApproval?'v'+oldApproval+' 的确认已失效，':'')+'请重新确认当前范围。');persist();render();toast('设计范围已变更，当前版本待重新确认。')}if(el.dataset.change==='candidate'){state.n3Undo=[...state.selection];state.selection=el.checked?[...new Set([...state.selection,el.dataset.id])]:state.selection.filter(x=>x!==el.dataset.id);state.n3Saved=null;persist();render()}});
document.addEventListener('input',event=>{if(event.target.id==='selection-reason'){state.selectionReason=event.target.value;persist()}});
document.getElementById('chat-form').addEventListener('submit',event=>{event.preventDefault();const input=document.getElementById('chat-input');const text=input.value;input.value='';answerQuestion(text)});
document.getElementById('chat-input').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();document.getElementById('chat-form').requestSubmit()}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&drawerMode)closeDrawer();if(event.key==='Tab'&&drawerMode&&!document.getElementById('reset-dialog').open){const items=[...document.getElementById('inspector').querySelectorAll('button,a,input,textarea,select')].filter(x=>!x.disabled&&!x.hidden);if(!items.length)return;const first=items[0],last=items[items.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}});

const ROLE_COPY_UPDATES={"把序列规则、骨架规则与保护 motif 分开看；具体残基映射仍待提供。":"把序列规则、骨架规则与保护 motif 分开看，再按来源记录确认本轮范围。","确认这版设计范围。真实执行所需的链、残基映射与预算仍待补齐。":"确认这版设计范围。后续扩大范围或预算时，再发起确认。","真实结构、配置日志、完整候选表与 AF3 原始输出还没有提供。我打开来源面板，把已有资料和缺项分开列出。":"我打开团队研究记录，查看本轮输入与判断依据。对应原始引用和当前演示包范围，在来源面板说明。","先保留复核提案，补齐材料并确认范围与预算。这个演示不会提交真实计算。":"先保留复核提案，确认本轮范围与预算后，再按记录接续。当前页面不会提交真实计算。","当前可以切换 site 0、site 1 或并排比较选择。图像只是概念视觉；真实表面和位点坐标等待提供。":"当前可以切换 site 0、site 1 或并排比较选择。把两处选择与约束一起看，再保存本轮设计意图。","团队研究记录中，633 个结果只有 3 个 seed 来源，具体占比尚未导入。":"团队研究记录中，633 个结果只有 3 个 seed 来源。先看来源和结构家族，不能把总数当作独立方案数。"};
state.chat.forEach(message=>{if(message.role!=='用户'&&message.sourceKind==='synthetic'&&ROLE_COPY_UPDATES[message.text])message.text=ROLE_COPY_UPDATES[message.text]});
if(!state.chat.length)sceneMessages('N1');persist();render();
